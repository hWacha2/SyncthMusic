<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b11">
<title>SynctMusic</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="atmosphere" aria-hidden="true"></div>

<header class="appbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="26" cy="32" r="19" fill="none" stroke="#ff6a3d" stroke-width="2.4"/>
      <circle cx="26" cy="32" r="12.5" fill="none" stroke="#52445c" stroke-width="1.2"/>
      <circle cx="26" cy="32" r="6" fill="#ff6a3d"/>
      <circle cx="26" cy="32" r="1.6" fill="#141018"/>
      <path d="M45 23a12 12 0 0 1 0 18M51 18a20 20 0 0 1 0 28" fill="none" stroke="#d9f26b" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="brand-text">
      <span class="word">SYNCTMUSIC</span>
      <span class="sub mono" id="app-dev">…</span>
    </div>
  </div>
  <div class="appbar-right">
    <span class="led" id="app-led"></span>
    <span class="appbar-state" id="app-state">проверка</span>
    <button class="icon-btn" data-act="refresh" data-i18n-aria="appbar.refresh" aria-label="Обновить">
      <svg><use href="#i-refresh"/></svg>
    </button>
  </div>
</header>

<main class="scroll" id="view">
  <section class="panel"><div class="empty"><b data-i18n="boot.loadingTitle">Загрузка</b><p data-i18n="boot.loadingText">Читаем библиотеку…</p></div></section>
</main>

<nav class="tabs" id="tabs">
  <button class="tab" data-tab="overview"><svg><use href="#i-disc"/></svg><span data-i18n="tab.overview">Обзор</span></button>
  <button class="tab" data-tab="pending"><svg><use href="#i-clock"/></svg><span data-i18n="tab.pending">Удаления</span><i class="badge" id="badge-pending" hidden></i></button>
  <button class="tab" data-tab="vault"><svg><use href="#i-box"/></svg><span data-i18n="tab.vault">Хранилище</span></button>
  <button class="tab" data-tab="more"><svg><use href="#i-devices"/></svg><span data-i18n="tab.more">Ещё</span></button>
</nav>

<div class="toast-host" id="toast" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-disc" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 7.4V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24">
      <path d="M4 8.2 12 4l8 4.2v7.6L12 20l-8-4.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M4 8.2 12 12l8-3.8M12 12v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-devices" viewBox="0 0 24 24">
      <rect x="3" y="5" width="12.5" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M6.4 18h6.2M9.5 14v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="16.5" y="9" width="4.5" height="10" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="i-sync" viewBox="0 0 24 24">
      <path d="M19.4 12a7.4 7.4 0 0 1-12.7 5.2M4.6 12a7.4 7.4 0 0 1 12.7-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M17.6 3.4v3.6H14M6.4 20.6V17H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-scan" viewBox="0 0 24 24">
      <path d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M4 12h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-split" viewBox="0 0 24 24">
      <path d="M12 4v6M12 10 6.5 15v4.5M12 10l5.5 5v4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M4 7.5A1.5 1.5 0 0 1 5.5 6h4l1.6 2H18.5A1.5 1.5 0 0 1 20 9.5v7A1.5 1.5 0 0 1 18.5 18h-13A1.5 1.5 0 0 1 4 16.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-qr" viewBox="0 0 24 24">
      <rect x="4" y="4" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="14" y="4" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="4" y="14" width="6" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14 14h3v3h-3zM20 14v6h-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.8 9.6 17.4 19 7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 4.6 20.4 19H3.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 9.6v4.1M12 16.4v.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M19.4 12a7.4 7.4 0 1 1-2.2-5.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M19.6 3.6v4.2h-4.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8.5" y="8.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M15.5 5.5h-9a1 1 0 0 0-1 1v9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M5.5 7h13M9.5 7V4.8h5V7M7.2 7l.8 12h8l.8-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pc" viewBox="0 0 24 24">
      <rect x="3.5" y="5" width="17" height="11" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M8.5 19.5h7M12 16v3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
