[package]
name = "syncth-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "syncthd"
path = "src/main.rs"

[dependencies]
syncth-core = { path = "../core" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify = "8"
tiny_http = "0.12"
fs4 = "1.1.0"
notify-rust = "4.18.2"
tray-icon = "0.26.1"
qrcode = { version = "0.14.1", features = ["svg"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
