<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SynctMusic</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="atmosphere" aria-hidden="true"></div>

<header class="titlebar" data-tauri-drag-region>
  <div class="tb-brand" data-tauri-drag-region>
    <svg class="tb-logo" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="26" cy="32" r="19" fill="none" stroke="#ff6a3d" stroke-width="2.4"/>
      <circle cx="26" cy="32" r="12.5" fill="none" stroke="#52445c" stroke-width="1.2"/>
      <circle cx="26" cy="32" r="6" fill="#ff6a3d"/>
      <circle cx="26" cy="32" r="1.6" fill="#141018"/>
      <path d="M45 23a12 12 0 0 1 0 18M51 18a20 20 0 0 1 0 28" fill="none" stroke="#d9f26b" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <span class="tb-word">SYNCTMUSIC</span>
    <span class="tb-ver mono" id="tb-ver"></span>
  </div>

  <div class="tb-status" id="tb-status" data-tauri-drag-region>
    <span class="led" id="tb-led"></span>
    <span id="tb-state"></span>
    <span class="tb-dev mono" id="tb-dev"></span>
  </div>

  <div class="tb-controls">
    <button class="tb-btn" data-win="min" data-i18n-title="titlebar.minimize" data-i18n-aria="titlebar.minimize" title="Свернуть" aria-label="Свернуть">
      <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tb-btn" data-win="max" data-i18n-title="titlebar.maximize" data-i18n-aria="titlebar.maximize" title="Развернуть" aria-label="Развернуть">
      <svg viewBox="0 0 12 12"><rect x="2.4" y="2.4" width="7.2" height="7.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="tb-btn tb-close" data-win="close" data-i18n-title="titlebar.close" data-i18n-aria="titlebar.close" title="Закрыть" aria-label="Закрыть">
      <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <div class="rail-device">
      <div class="rail-k mono" data-i18n="rail.thisDevice">это устройство</div>
      <div class="rail-dev mono" id="rail-dev">—</div>
      <div class="rail-root" id="rail-root" data-i18n="rail.noLibrary">Библиотека не выбрана</div>
    </div>

    <nav class="nav" id="nav" data-i18n-aria="rail.sections" aria-label="Разделы"></nav>

    <div class="rail-foot">
      <div class="daemon-line">
        <span class="led" id="rail-led"></span>
        <span id="rail-daemon" data-i18n="rail.serviceStopped">служба остановлена</span>
      </div>
      <button class="link-btn" data-act="open-web"><span data-i18n="rail.web">Веб-интерфейс</span> <span class="arr">↗</span></button>
      <button class="link-btn" data-act="locale" id="rail-locale">English</button>
      <div class="rail-ver mono" id="rail-ver"></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="progress" id="progress" hidden><span></span></div>
    <div class="view" id="view"></div>
  </main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-disc" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="12" cy="12" r="0.9" fill="currentColor"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 7.4V12l3.2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-split" viewBox="0 0 24 24">
      <path d="M4 6h4l6 6h6M4 18h4l6-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17 3.6L20.4 6 17 8.4M17 15.6L20.4 18 17 20.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24">
      <path d="M4 7.5L12 4l8 3.5v9L12 20l-8-3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M4 7.5L12 11l8-3.5M12 11v9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-devices" viewBox="0 0 24 24">
      <rect x="3" y="5" width="12" height="9" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M6 18h6M9 14v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="16" y="9" width="5" height="9" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-qr" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="14.5" y="3.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <rect x="3.5" y="14.5" width="6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M14.5 14.5h2.6v2.6h-2.6zM18.4 18.4h2.1v2.1h-2.1z" fill="currentColor"/>
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="16" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <circle cx="8" cy="17" r="2.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-scan" viewBox="0 0 24 24">
      <path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
    </symbol>
    <symbol id="i-sync" viewBox="0 0 24 24">
      <path d="M19 8.5A8 8 0 0 0 5.6 7M5 15.5A8 8 0 0 0 18.4 17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      <path d="M19 4.6v4h-4M5 19.4v-4h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24">
      <path d="M8 5.4L18 12 8 18.6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="8.5" y="8.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M15.5 6.5v-1a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-folder" viewBox="0 0 24 24">
      <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.4h8a1.5 1.5 0 0 1 1.5 1.5v7.6A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path d="M19 12a7 7 0 1 1-2.1-5M19 4.6V9h-4.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M13 5h6v6M19 5l-8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 14v4a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 18V8A1.5 1.5 0 0 1 6.5 6.5H10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.6l4.4 4.4L19 6.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 4.5l8.2 15H3.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 10v3.8M12 16.6v.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-pc" viewBox="0 0 24 24">
      <rect x="3" y="4.5" width="18" height="12" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M8 20h8M12 16.5V20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24">
      <rect x="7" y="2.8" width="10" height="18.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M10.8 5.6h2.4M11 18.6h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-warn" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
      <path d="M12 7.6V13M12 15.8v.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="toast-host" id="toasts"></div>
<div id="modal" class="modal-host" hidden></div>

<div class="resize-layer" aria-hidden="true">
  <div class="rz rz-n" data-resize="North"></div>
  <div class="rz rz-s" data-resize="South"></div>
  <div class="rz rz-w" data-resize="West"></div>
  <div class="rz rz-e" data-resize="East"></div>
  <div class="rz rz-nw" data-resize="NorthWest"></div>
  <div class="rz rz-ne" data-resize="NorthEast"></div>
  <div class="rz rz-sw" data-resize="SouthWest"></div>
  <div class="rz rz-se" data-resize="SouthEast"></div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
