[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/desktop/src-tauri",
    "crates/mobile/src-tauri",
    "crates/mobile/plugins/foreground-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
getrandom = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
filetime = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"

# Debug-сборка не должна быть в разы медленнее release на горячем пути скана:
# телефон тратит почти всё время на BLAKE3. opt-level = 1 для своего кода и
# opt-level = 3 для хешера дают основной прирост, не ломая отладочность.
[profile.dev]
opt-level = 1

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 2
